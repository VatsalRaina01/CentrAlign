{% extends "base.html" %}
{% block title %}Create Ticket — Acme Corp IT Portal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create Support Ticket</h1>
</div>

<form method="POST" action="/tickets/create" class="ticket-form" id="create-ticket-form">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required placeholder="Brief description of the issue" class="form-input">
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" required rows="4" placeholder="Detailed description of the issue..." class="form-input"></textarea>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority" class="form-input">
                <option value="P1">P1 — Critical</option>
                <option value="P2">P2 — High</option>
                <option value="P3" selected>P3 — Medium</option>
                <option value="P4">P4 — Low</option>
            </select>
        </div>

        <div class="form-group">
            <label for="service">Affected Service</label>
            <select id="service" name="service" class="form-input">
                {% for service in services %}
                <option value="{{ service.name }}">{{ service.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="assigned_to">Assign To</label>
        <select id="assigned_to" name="assigned_to" class="form-input">
            <option value="Unassigned">Unassigned</option>
            <option value="Sarah Chen">Sarah Chen — IT Manager</option>
            <option value="Mike Johnson">Mike Johnson — DevOps Lead</option>
            <option value="Priya Sharma">Priya Sharma — SysAdmin</option>
        </select>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="btn-submit-ticket">Create Ticket</button>
        <a href="/tickets" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
